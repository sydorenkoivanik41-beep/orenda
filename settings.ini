[міста]
# Одне місто = один рядок:   Назва = адреса міста на OLX
# «Адреса міста на OLX» — це останнє слово в адресі сторінки
# olx.ua/uk/nedvizhimost/kvartiry/dolgosrochnaya-arenda-kvartir/ЦЕ_СЛОВО/
# (як його знайти — дивіться інструкцію, розділ «Як додати місто»).
# Для LUN назва міста підставляється автоматично.
Київ = kiev
Черкаси = cherkassy
Одеса = odessa
Львів = lvov
Івано-Франківськ = ivano-frankovsk

[налаштування]
# Скільки сторінок брати з кожного джерела для кожного міста.
# OLX: 1 сторінка ≈ 50 оголошень. LUN: 1 сторінка ≈ 24 оголошення.
сторінок_olx = 10
сторінок_lun = 8

# Пауза між запитами до сайтів, у секундах (випадкове число між «від» і «до»).
# Не зменшуйте — це захищає сайти від перевантаження, а вас від блокування.
пауза_від = 3
пауза_до = 7

# Скільки активних оголошень може мати один автор / номер телефону,
# щоб ще вважатися власником. Більше — «ймовірний посередник», приховуємо.
макс_оголошень_автора = 3

# Оголошення, старші за стільки днів, прибираємо із сайту.
днів_зберігати = 30

# Перевіряти схожість фото (так / ні). Сповільнює перший запуск.
порівнювати_фото = так

# Курс долара на випадок, якщо джерело не дало свій курс (грн за 1 $).
курс_usd = 41.5

