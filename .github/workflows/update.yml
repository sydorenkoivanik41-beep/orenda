name: Оновлення оголошень

# ДЕМО-РЕЖИМ: автоматичного збору немає (сервери GitHub OLX і LUN блокують).
# Сайт перебудовується з даних у папці raw/, коли вони змінюються,
# або вручну кнопкою «Run workflow».
on:
  push:
    paths:
      - "raw/**"
      - "collector/**"
      - "web/**"
      - "*.txt"
      - "settings.ini"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: orenda-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Встановити бібліотеку для порівняння фото
        run: pip install --quiet pillow
      - name: Обробити зібрані оголошення й опублікувати сайт
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collector/from_raw.py
