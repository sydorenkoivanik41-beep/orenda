<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f4ef">
<title>Оренда від власників</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5f4a'/%3E%3Cpath d='M8 16l8-7 8 7v8h-5v-5h-6v5H8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top__row">
    <div class="brand"><span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="18" height="18"><path d="M8 16l8-7 8 7v8h-5v-5h-6v5H8z" fill="currentColor"/></svg></span>Оренда <b>без ріелторів</b></div>
    <button class="btn-ghost" id="shareBtn" type="button" aria-label="Поділитися добіркою">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Поділитися</span>
    </button>
  </div>
  <div class="top__row top__controls">
    <label class="select-wrap select-wrap--city"><span class="sr">Місто</span>
      <select id="city"></select>
    </label>
    <button class="btn-filter" id="openFilters" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Фільтри<span class="badge" id="filterCount" hidden></span>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="bar">
    <div class="summary" id="summary">Завантаження…</div>
    <label class="select-wrap sort-wrap"><span class="sr">Сортування</span>
      <select id="sort">
        <option value="new">Спочатку нові</option>
        <option value="cheap">Спочатку дешевші</option>
        <option value="expensive">Спочатку дорожчі</option>
      </select>
    </label>
  </div>
  <div class="chips" id="activeChips"></div>
  <div id="list" class="list"></div>
  <button id="more" class="btn-more" type="button" hidden>Показати ще</button>
  <footer class="foot" id="foot"></footer>
</main>

<!-- Панель фільтрів -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet__backdrop" data-close></div>
  <form class="sheet__panel" id="filters" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet__head">
      <h2 id="sheetTitle">Фільтри</h2>
      <button type="button" class="btn-x" data-close aria-label="Закрити">✕</button>
    </div>
    <div class="sheet__body">
      <fieldset>
        <legend>Район</legend>
        <select name="district" id="district"><option value="">Усі райони</option></select>
      </fieldset>
      <fieldset>
        <legend>Ціна, грн / міс</legend>
        <div class="range">
          <input name="pmin" inputmode="numeric" placeholder="від">
          <span>—</span>
          <input name="pmax" inputmode="numeric" placeholder="до">
        </div>
      </fieldset>
      <fieldset>
        <legend>Площа, м²</legend>
        <div class="range">
          <input name="amin" inputmode="numeric" placeholder="від">
          <span>—</span>
          <input name="amax" inputmode="numeric" placeholder="до">
        </div>
      </fieldset>
      <fieldset>
        <legend>Кімнат</legend>
        <div class="seg">
          <label><input type="checkbox" name="rooms" value="1"><span>1</span></label>
          <label><input type="checkbox" name="rooms" value="2"><span>2</span></label>
          <label><input type="checkbox" name="rooms" value="3"><span>3</span></label>
          <label><input type="checkbox" name="rooms" value="4"><span>4+</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Поверх</legend>
        <div class="toggles">
          <label class="tg"><input type="checkbox" name="nf"><span>Не перший</span></label>
          <label class="tg"><input type="checkbox" name="nl"><span>Не останній</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Умови</legend>
        <div class="toggles">
          <label class="tg"><input type="checkbox" name="pets"><span>Можна з тваринами</span></label>
          <label class="tg"><input type="checkbox" name="kids"><span>Можна з дітьми</span></label>
          <label class="tg"><input type="checkbox" name="furn"><span>З меблями</span></label>
          <label class="tg"><input type="checkbox" name="tech"><span>З технікою</span></label>
          <label class="tg"><input type="checkbox" name="photo"><span>Тільки з фото</span></label>
          <label class="tg"><input type="checkbox" name="sure"><span>Лише «Від власника» (без сумнівних)</span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Опубліковано</legend>
        <div class="seg seg--wide">
          <label><input type="radio" name="age" value=""><span>Будь-коли</span></label>
          <label><input type="radio" name="age" value="1"><span>Сьогодні</span></label>
          <label><input type="radio" name="age" value="3"><span>3 дні</span></label>
          <label><input type="radio" name="age" value="7"><span>Тиждень</span></label>
        </div>
      </fieldset>
    </div>
    <div class="sheet__foot">
      <button type="button" class="btn-ghost" id="resetFilters">Скинути</button>
      <button type="submit" class="btn-primary" id="applyFilters">Показати</button>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<template id="cardTpl">
  <article class="card">
    <div class="gallery">
      <div class="gallery__track"></div>
      <span class="gallery__count"></span>
      <button class="gallery__nav gallery__nav--prev" type="button" aria-label="Попереднє фото">‹</button>
      <button class="gallery__nav gallery__nav--next" type="button" aria-label="Наступне фото">›</button>
    </div>
    <div class="card__body">
      <div class="card__top">
        <div class="price"></div>
        <span class="trust"></span>
      </div>
      <div class="facts"></div>
      <div class="place"></div>
      <h3 class="title"></h3>
      <p class="text"></p>
      <button class="more-text" type="button">Читати повністю</button>
      <div class="feat"></div>
      <div class="why"></div>
      <div class="card__bottom">
        <span class="date"></span>
        <div class="links"></div>
      </div>
    </div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
